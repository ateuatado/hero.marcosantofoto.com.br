<?xml version="1.0" encoding="UTF-8"?>
<!-- Marco Santo — Monocromático Branco (fundo transparente) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&amp;family=Inter:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- MARCO SANTO -->
  <text x="300" y="90" text-anchor="middle"
        font-family="'EB Garamond', Georgia, serif"
        font-weight="500"
        font-size="34"
        letter-spacing="9"
        fill="#FFFFFF">MARCO SANTO</text>

  <!-- Linha -->
  <line x1="210" y1="110" x2="390" y2="110"
        stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>

  <!-- FOTOGRAFIA -->
  <text x="300" y="138" text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="300"
        font-size="11"
        letter-spacing="8"
        fill="#FFFFFF"
        opacity="0.6">FOTOGRAFIA</text>
</svg>
