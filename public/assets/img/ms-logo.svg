<?xml version="1.0" encoding="UTF-8"?>
<!-- Marco Santo Fotografia — Logo Primário Vertical (Gold on Black) -->
<!-- Tipografia: EB Garamond 500 + Inter 300 -->
<!-- Proporções: Nome 28px, Linha 0.5px, Subtítulo 10px -->
<!-- Espaçamento: Nome 0.25em, Subtítulo 0.45em -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&amp;family=Inter:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#000000"/>

  <!-- MARCO SANTO — EB Garamond 500 -->
  <text x="300" y="90" text-anchor="middle"
        font-family="'EB Garamond', Georgia, serif"
        font-weight="500"
        font-size="34"
        letter-spacing="9"
        fill="#C5A059">MARCO SANTO</text>

  <!-- Linha divisória — fina, dourada, 40% da largura -->
  <line x1="210" y1="110" x2="390" y2="110"
        stroke="#C5A059" stroke-width="0.5" opacity="0.6"/>

  <!-- FOTOGRAFIA — Inter 300 -->
  <text x="300" y="138" text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="300"
        font-size="11"
        letter-spacing="8"
        fill="#C5A059"
        opacity="0.7">FOTOGRAFIA</text>
</svg>
